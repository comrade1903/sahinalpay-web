name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, validate, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Advisory only: a new advisory in a build-time package must not block
        # a content fix. Production dependencies are the gate.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit || echo "::warning::npm audit reported findings in dev dependencies"

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Scan tracked files for credential-shaped strings
        run: npm run check:secrets

      - name: Validate archive content
        run: npm run validate:content

      - name: Check the committed generated files are current
        run: |
          npm run generate:sitemap
          npm run generate:summary
          git diff --exit-code -- public/sitemap.xml public/robots.txt src/archive/summary.generated.ts \
            || { echo "::error::A generated file is stale — run 'npm run generate:sitemap' and 'npm run generate:summary' and commit the result."; exit 1; }

      - name: Build
        run: npm run build

      - name: Check the build produced the prerendered pages
        run: |
          test -f dist/404.html
          count=$(find dist -name index.html | wc -l)
          echo "Prerendered $count HTML pages"
          test "$count" -gt 500
